<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Responsive Website</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="card">
      <h2>Welcome!</h2>
      <p>This website adjusts to mobile, tablet and desktop screens.</p>
    </section>
    <section class="card" id="about">
      <h2>About</h2>
      <p>I am learning responsive web design during my internship.</p>
    </section>
    <section class="card" id="contact">
      <h2>Contact</h2>
      <p>This layout uses CSS media queries.</p>
    </section>
  </main>
</body>
</html>
