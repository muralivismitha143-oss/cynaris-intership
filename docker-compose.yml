version: '3.8'

# ==============================================================================
# Docker Compose — Cynaris Recruitment Platform Local Dev & Production Parity
# Services:
#   1. web: Multi-stage Node.js Express Application Server (Port 3000)
#   2. db: MySQL 8.0 Relational Database with Healthchecks & Init Schema
#   3. migration: Automated Database Migration Runner
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Primary Web Application & API Gateway
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: cynaris-recruitment-platform:latest
    container_name: cynaris-web-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "${REMINDERS_PORT:-3005}:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      REMINDERS_PORT: 3005
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_NAME:-espocrm}
      MYSQL_USER: ${DB_USER:-espocrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-espocrm_secret_pw}
      JWT_SECRET: ${JWT_SECRET:-cynaris-jwt-production-secret-key-2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLIENT_TIMEZONE: ${CLIENT_TIMEZONE:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - cynaris-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cynaris-mysql-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_in_prod}
      MYSQL_DATABASE: ${DB_NAME:-espocrm}
      MYSQL_USER: ${DB_USER:-espocrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-espocrm_secret_pw}
    volumes:
      - cynaris-mysql-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cynaris-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_ROOT_PASSWORD:-root_password_change_in_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Database Migration Runner (Runs DDL schema migrations then exits)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: cynaris-migration-runner
    command: ["node", "backend/database/runMigrations.js"]
    environment:
      NODE_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_NAME:-espocrm}
      MYSQL_USER: ${DB_USER:-espocrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-espocrm_secret_pw}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cynaris-network
    restart: "no"

volumes:
  cynaris-mysql-data:
    driver: local

networks:
  cynaris-network:
    driver: bridge
